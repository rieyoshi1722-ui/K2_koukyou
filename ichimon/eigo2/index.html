<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>英語 論理・表現 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 1枚のカードに「問い」→タップで「答え」。ボタンはカードの真下に置いて、指が届く範囲に収める。 */
:root {
  --paper: #f3f5f9; --sheet: #ffffff; --grid: #e0e6f1; --ink: #1c2540; --ink-soft: #5a6684;
  --accent: #b8322a; --accent-ink: #ffffff; --marker: #ffe3b8; --marker-ink: #6b3a00;
  --ok: #1f8a5b; --ok-bg: #dff3e8; --miss: #c8452f; --miss-bg: #fde4de; --line: #cbd4e6;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;
    --accent: #ff8f80; --accent-ink: #0f1626; --marker: #5c3d12; --marker-ink: #ffe6bd;
    --ok: #6fd3a2; --ok-bg: #173a2c; --miss: #ff9a86; --miss-bg: #432019; --line: #2f3d63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;
  --accent: #ff8f80; --accent-ink: #0f1626; --marker: #5c3d12; --marker-ink: #ffe6bd;
  --ok: #6fd3a2; --ok-bg: #173a2c; --miss: #ff9a86; --miss-bg: #432019; --line: #2f3d63; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.8; padding-inline: 16px; padding-block: 0; touch-action: manipulation; }
#app { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }

.home { display: flex; flex-direction: column; gap: 18px; padding-block: 22px 40px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.title-row h1 { font-size: 28px; font-weight: 900; }
.sub { color: var(--ink-soft); font-size: 13px; }
.review-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 14px; background: var(--miss-bg); border: 2px solid var(--miss); }
.review-card[disabled] { opacity: .55; cursor: default; }
.review-card .big { font-family: var(--font-display); font-weight: 900; font-size: 19px; }
.review-card .count { font-family: var(--font-display); font-weight: 900; font-size: 32px; font-variant-numeric: tabular-nums; color: var(--miss); }
.review-card small { display: block; color: var(--ink-soft); font-size: 12.5px; line-height: 1.5; }
.opt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
.seg { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
.seg button { padding: 4px 16px; font-weight: 700; font-size: 14px; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sec-list { display: grid; gap: 10px; }
.sec-btn { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 12px; background: var(--sheet); border: 1.5px solid var(--line); }
.sec-btn .nm { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.sec-btn .pg { font-size: 12px; color: var(--ink-soft); }
.sec-btn .st { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); text-align: right; }
.sec-btn .bar { grid-column: 1 / -1; }
.all-btn { padding: 15px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

.quiz { padding-block: 0 56px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); padding-block: 12px 8px; display: grid; gap: 8px; }
.topbar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.back { padding: 6px 10px; margin-left: -10px; font-weight: 700; color: var(--accent); }
.counter { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
.card { background-color: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px 16px 20px; margin-top: 8px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.tag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.chip.sub2 { background: var(--grid); color: var(--ink-soft); }
.chip.warn { background: var(--marker); color: var(--marker-ink); }
.q { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.7; margin: 0; overflow-wrap: anywhere; }
.a-box { margin-top: 16px; padding: 14px 14px; border-radius: 10px; background: var(--marker); color: var(--marker-ink); font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1.6; overflow-wrap: anywhere; }
.a-lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; opacity: .8; }
.pending-note { margin: 12px 0 0; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: var(--marker); color: var(--marker-ink); line-height: 1.5; }
.actions { display: grid; gap: 10px; margin-top: 16px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.act { min-height: 66px; padding: 15px 10px; border-radius: 14px; font-family: var(--font-display); font-weight: 900; font-size: 19px; }
.act.reveal { background: var(--accent); color: var(--accent-ink); }
.act.ok { background: var(--ok-bg); color: var(--ok); border: 2px solid var(--ok); }
.act.miss { background: var(--miss-bg); color: var(--miss); border: 2px solid var(--miss); }
.act:active { transform: translateY(1px); }

.result { display: flex; flex-direction: column; gap: 18px; padding-block: 40px; }
.result h2 { font-size: 26px; font-weight: 900; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score div { padding: 14px; border-radius: 12px; text-align: center; font-family: var(--font-display); font-weight: 700; }
.score .ok { background: var(--ok-bg); color: var(--ok); }
.score .miss { background: var(--miss-bg); color: var(--miss); }
.score b { display: block; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.btns { display: grid; gap: 10px; }
.btn2 { padding: 14px; border-radius: 12px; font-family: var(--font-display); font-weight: 700; font-size: 16px; border: 2px solid var(--accent); color: var(--accent); }
.btn2.primary { background: var(--accent); color: var(--accent-ink); }

.inst { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.6; }
.jp { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0 0 8px; }
.en { font-family: var(--font-body); font-weight: 500; font-size: 20px; line-height: 1.8; margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.hint { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 8px; background: var(--grid); color: var(--ink-soft); font-size: 14px; }
.qimg { display: block; width: 100%; max-width: 360px; height: auto; margin: 12px auto 0; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt-b { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 11px 12px; border-radius: 10px; background: var(--sheet); border: 2px solid var(--line); font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.opt-b .k { flex: none; font-family: var(--font-display); font-weight: 900; color: var(--accent); }
.opt-b[aria-pressed="true"] { border-color: var(--accent); background: var(--grid); }
.opt-b.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.opt-b.wrong { border-color: var(--miss); background: var(--miss-bg); color: var(--miss); }
.full { margin: 10px 0 0; font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.exp { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--sheet); border: 1.5px solid var(--line); font-size: 15.5px; line-height: 1.8; overflow-wrap: anywhere; }
.exp .a-lbl { color: var(--accent); }
.notes { padding-block: 0 56px; }
.notes h2 { font-size: 22px; font-weight: 900; margin: 14px 0 4px; }
.pt { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
.pt h3 { font-size: 17px; font-weight: 900; color: var(--accent); margin-bottom: 4px; }
.pt p { margin: 4px 0; font-size: 15.5px; line-height: 1.8; overflow-wrap: anywhere; }
.pt .eg { margin: 6px 0 2px; padding: 6px 10px; border-left: 4px solid var(--marker); background: var(--paper); font-size: 15px; line-height: 1.7; }
.pt .eg b { font-weight: 700; }
.sec-btn.note-b { border-style: dashed; background: var(--paper); }
.sec-btn.note-b .nm::before { content: "📘 "; }
.sec-btn.vocab-b .nm::before { content: "🔤 "; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

var CARDS = RAW.map(function (r, i) { r.id = r.s + "-" + (i + 1); r.sec = r.s; r.page = r.p; return r; });
var pick = null;
var LS_KEY = "eigo2-ichimon-v1";
var state = { review: [], ok: {}, order: "order" };
function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && Array.isArray(s.review)) state = { review: s.review.slice(), ok: Object.assign({}, s.ok || {}), order: s.order === "random" ? "random" : "order" };
  } catch (e) {}
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

var view = "home", session = null, noteId = null;
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function secOf(id) { return SECTIONS.filter(function (s) { return s.id === id; })[0]; }
function cardsOfSec(id) { return CARDS.filter(function (c) { return c.sec === id; }); }
function reviewCards() { return CARDS.filter(function (c) { return state.review.indexOf(c.id) >= 0; }); }

function start(cards, mode, label) {
  if (!cards.length) return;
  session = { cards: state.order === "order" && mode !== "review" ? cards.slice() : shuffle(cards), i: 0, mode: mode, label: label, okN: 0, missN: 0, shown: false, lockUntil: 0 };
  view = "quiz"; pick = null;
  render();
}
function reveal() { session.shown = true; session.lockUntil = Date.now() + 450; render(); }
function answer(good) {
  if (Date.now() < session.lockUntil) return;
  var c = session.cards[session.i];
  if (good) {
    session.okN++;
    state.ok[c.id] = (state.ok[c.id] || 0) + 1;
    if (session.mode === "review") state.review = state.review.filter(function (x) { return x !== c.id; });
  } else {
    session.missN++;
    if (state.review.indexOf(c.id) < 0) state.review.push(c.id);
  }
  session.i++;
  session.shown = false; pick = null;
  if (session.i >= session.cards.length) view = "result";
  render();
  window.scrollTo(0, 0);
  save();
}

function el(tag, props, kids) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    if (props[k] === null || props[k] === undefined) return;
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

  if (c.opts) {
    kids.push(el("div", { class: "opts" }, c.opts.map(function (t, k) {
      var cls = "opt-b" + (session.shown ? (k === c.ok ? " right" : (k === pick ? " wrong" : "")) : "");
      var b = el("button", { type: "button", class: cls, "aria-pressed": String(!session.shown && pick === k), onclick: function () { if (session.shown) return; pick = k; render(); } }, [el("span", { class: "k", text: KANA[k] }), el("span", { text: t })]);
      return b;
    })));
  }
  if (session.shown) {
    var ans = c.opts ? KANA[c.ok] + "  " + c.opts[c.ok] : c.a;
    kids.push(el("div", { class: "a-box" }, [el("span", { class: "a-lbl", text: "答え" }), ans]));
    if (c.opts && pick !== null) kids.push(el("p", { class: "note", text: pick === c.ok ? "◎ えらんだ答えは正解!" : "えらんだのは「" + KANA[pick] + "」でした。" }));
    if (c.full) kids.push(el("p", { class: "full", text: c.full }));
    if (c.exp) kids.push(el("div", { class: "exp" }, [el("span", { class: "a-lbl", text: "解説" }), c.exp]));
    if (c.note) kids.push(el("p", { class: "pending-note", text: c.note }));
  }
  var top = el("div", { class: "topbar" }, [
    el("div", { class: "row" }, [
      el("button", { type: "button", class: "back", text: "‹ もどる", onclick: function () { view = "home"; render(); } }),
      el("div", { class: "counter", text: (session.i + 1) + " / " + session.cards.length })
    ]),
    el("div", { class: "bar" }, [el("i", { style: "width:" + Math.round(session.i / session.cards.length * 100) + "%" })])
  ]);
  var actions = session.shown
    ? el("div", { class: "actions two" }, [
        el("button", { type: "button", class: "act miss", text: "まちがえた", onclick: function () { answer(false); } }),
        el("button", { type: "button", class: "act ok", text: "できた", onclick: function () { answer(true); } })
      ])
    : el("div", { class: "actions" }, [el("button", { type: "button", class: "act reveal", text: "答えを見る", onclick: reveal })]);
  return el("div", { class: "quiz" }, [top, el("div", { class: "card" }, kids), actions]);
}

function renderResult() {
  var rc = reviewCards();
  var btns = [];
  if (rc.length) btns.push(el("button", { type: "button", class: "btn2 primary", text: "復習フォルダを出題(" + rc.length + "問)", onclick: function () { start(rc, "review", "復習フォルダ"); } }));
  btns.push(el("button", { type: "button", class: "btn2" + (rc.length ? "" : " primary"), text: "もう一度", onclick: function () { start(session.cards, session.mode, session.label); } }));
  btns.push(el("button", { type: "button", class: "btn2", text: "ホームへ", onclick: function () { view = "home"; render(); } }));
  return el("div", { class: "result" }, [
    el("h2", { text: session.label + " おつかれさま" }),
    el("div", { class: "score" }, [
      el("div", { class: "ok" }, [el("b", { text: String(session.okN) }), "できた"]),
      el("div", { class: "miss" }, [el("b", { text: String(session.missN) }), "まちがえた"])
    ]),
    el("div", { class: "btns" }, btns)
  ]);
}

function renderNotes() {
  var s = secOf(noteId), items = NOTES[noteId] || [];
  var pts = items.map(function (it) {
    var k = [el("h3", { text: it[0] })];
    it[1].split("\n").forEach(function (l) { k.push(el("p", { text: l })); });
    it[2].forEach(function (e) { k.push(el("div", { class: "eg", text: e })); });
    return el("div", { class: "pt" }, k);
  });
  return el("div", { class: "notes" }, [
    el("div", { class: "topbar" }, [el("div", { class: "row" }, [el("button", { type: "button", class: "back", text: "‹ もどる", onclick: function () { view = "home"; render(); } }), el("div", { class: "counter", text: "プリント " + s.page })])]),
    el("h2", { text: s.name })
  ].concat(pts).concat([el("button", { type: "button", class: "btn2", style: "margin-top:16px;width:100%", text: "ホームへ", onclick: function () { view = "home"; render(); window.scrollTo(0, 0); } })]));
}
function render() {
  var app = document.getElementById("app");
  app.textContent = "";
  app.appendChild(view === "home" ? renderHome() : view === "quiz" ? renderQuiz() : view === "notes" ? renderNotes() : renderResult());
}
loadState();
render();
</script></body></html>
