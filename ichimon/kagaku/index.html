<title>化学 一問一答</title>

<style>

}
@media (prefers-color-scheme: dark) {

    --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;
    --accent: #8fb0ff; --accent-ink: #0f1626; --marker: #7a2d52; --marker-ink: #ffd9e8;

  }
}

  --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;

}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.8; padding-inline: 16px; padding-block: 0; touch-action: manipulation; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }

.counter { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
.card { background-color: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px 16px 20px; margin-top: 8px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }

.exp p { margin: 2px 0 0; }
.exp-lbl { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.pending-note { margin: 12px 0 0; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: var(--marker); color: var(--marker-ink); line-height: 1.5; }
.actions { display: grid; gap: 10px; margin-top: 16px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.act { min-height: 66px; padding: 15px 10px; border-radius: 14px; font-family: var(--font-display); font-weight: 900; font-size: 19px; }
.act.reveal { background: var(--accent); color: var(--accent-ink); }
.act.ok { background: var(--ok-bg); color: var(--ok); border: 2px solid var(--ok); }
.act.miss { background: var(--miss-bg); color: var(--miss); border: 2px solid var(--miss); }
.act:active { transform: translateY(1px); }

.result { display: flex; flex-direction: column; gap: 18px; padding-block: 40px; }
.result h2 { font-size: 26px; font-weight: 900; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score div { padding: 14px; border-radius: 12px; text-align: center; font-family: var(--font-display); font-weight: 700; }
.score .ok { background: var(--ok-bg); color: var(--ok); }
.score .miss { background: var(--miss-bg); color: var(--miss); }
.score b { display: block; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.btns { display: grid; gap: 10px; }
.btn2 { padding: 14px; border-radius: 12px; font-family: var(--font-display); font-weight: 700; font-size: 16px; border: 2px solid var(--accent); color: var(--accent); }
.btn2.primary { background: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

["5","極性分子の例には、" + B + "H2O、エタノールC2H5OHなどがある。","水",0,"水の分子は、電気のかたよりがある極性分子です。"],
["5","極性分子は、無極性分子より分子間力が" + B + "。","強い",0,"プラスとマイナスで引き合うので、分子間力が強くなります。"],
["5","極性分子は、無極性分子より融点・沸点が" + B + "。","高い",0,"分子間力が強いと、引きはなすのに大きな熱が必要なので、融点・沸点が高くなります。"],
// 6 共有結合の結晶・黒鉛
["6","非金属の原子どうしが共有結合すると、通常は" + B + "ができる。","分子",0,"たとえば水素原子2個と酸素原子1個が共有結合して、水分子H2Oができます。"],
["6","14族の炭素Cやケイ素Siのように、" + B + "個の価電子をもつ原子は、多数の原子が次々に共有結合で結びつくことができる。","4",0,"価電子が4個あるので、まわりの4個の原子と手をつなげます。それが次々につながって、巨大な結晶になります。"],
["6","多数の原子がすべて三次元的に共有結合で結びつき、規則正しく配列してできた結晶を" + B + "という。","共有結合の結晶",0,"ダイヤモンドCのように、原子がぜんぶ共有結合でつながった結晶です。"],

["6","共有結合の結晶は、非常に" + B + "く、融点や沸点も非常に高い。","硬",0,"共有結合は強い結合なので、結晶全体が非常に硬くなります。"],
["6","共有結合の結晶の融点や沸点は、非常に" + B + "い。","高",0,"原子がすべて強い共有結合でつながっているので、こわすために大きな熱が必要です。"],
["6","共有結合の結晶は、水に溶け" + B + "。","にくい",0,"結合が強く、水に引きはなされないので、水に溶けにくいです。"],
["6","共有結合の結晶の電気伝導性は" + B + "。","ない",0,"電気を運ぶ自由な電子がないので、電気を通しません。"],
["6","ケイ素の結晶は、電気をわずかに導く" + B + "である。","半導体",0,"電気をまったく通さないわけではなく、少しだけ通す物質です。パソコンやスマホの部品に使われます。"],
["6","黒鉛の炭素原子は、価電子3個で隣り合う3個の炭素原子と共有結合し、" + B + "を基本単位とする平面の層状構造を作っている。","正六角形",0,"六角形がびっしり並んだ平らな板が、何枚も重なっている形です。"],
["6","黒鉛の残る1個の価電子は、層の間を" + B + "に動き、層を結びつけている。","自由",0,"自由に動ける電子があるので、黒鉛は電気を通します。"],
["6","黒鉛は、平面構造どうしが" + B + "で弱く結合しているため、もろくはがれやすい。","分子間力",0,"層と層の間は弱い力で引き合っているだけなので、はがれやすいです。"],
["6","黒鉛は、もろくはがれやすい性質を生かして、" + B + "の芯に使われる。","鉛筆",0,"黒鉛がはがれて紙にくっつくので、字が書けます。"],
["6","黒鉛は、水に溶け" + B + "。","にくい",0,"共有結合の結晶と同じで、水には溶けにくいです。"],
["6","黒鉛の電気伝導性は" + B + "。","ある",0,"層の間を自由に動く電子があるので、電気をよく通します。ダイヤモンドとのちがいです。"],
// 7 まとめ
["7","金属元素の原子どうしの結合を" + B + "結合という。","金属",0,"金属元素の原子どうしは、自由電子でつながる金属結合になります。"],
["7","金属元素の陽イオンと非金属元素の陰イオンの結合を" + B + "結合という。","イオン",0,"プラスとマイナスのイオンが、引き合ってできる結合です。例:塩化ナトリウムNaCl。"],
["7","非金属元素の原子どうしが電子を出し合ってつくる結合を" + B + "結合という。","共有",0,"電子を共有して手をつなぐので、共有結合といいます。"],
["7","分子と分子の間に働く弱い力を" + B + "という。","分子間力",0,"分子結晶は、分子間力で分子が集まってできています。"],

["7","イオン結合でできた結晶を" + B + "結晶という。","イオン",0,"例:塩化ナトリウムNaCl、酸化銅(II)CuO。"],
["7","分子間力でできた結晶を" + B + "結晶という。","分子",0,"例:ヨウ素I2、二酸化炭素CO2、水H2O。"],
["7","共有結合でできた結晶を" + B + "という。","共有結合の結晶",0,"例:ダイヤモンドC、二酸化ケイ素SiO2。"],
["7","金属結晶の化学式は" + B + "で表す。","組成式",0,"金属・イオン結晶・共有結合の結晶は組成式。分子結晶だけが分子式です。"],
["7","4種類の結晶のうち、化学式を分子式で表すのは" + B + "結晶だけである。","分子",0,"分子結晶だけは分子式を使います。ほかの3つは組成式です。"],
["7","電気伝導性が「よい」結晶は" + B + "結晶である。","金属",0,"自由電子が電気を運ぶので、金属はよく電気を通します。"],
["7","イオン結晶の電気伝導性は、固体では" + B + "。融解液や水溶液では電気を通す。","よくない",0,"固体ではイオンが動けないので電気を通しません。溶かすとイオンが動けるので通します。"],
["7","イオン結晶の融点は" + B + "。","高い",0,"プラスとマイナスのイオンの引き合う力が強いので、高い温度でやっと溶けます。"],
["7","イオン結晶は、硬いが、" + B + "という性質がある。","割れやすい",0,"力を加えてずれると、同じ符号のイオンが近づいて反発し合い、割れてしまいます。"],
["7","分子結晶の融点は" + B + "。","低い",0,"分子間力が弱いので、低い温度で溶けたり昇華したりします。"],
["7","分子結晶は、やわらかく、" + B + "という性質がある。","くだけやすい",0,"分子間力が弱いので、力を加えると簡単にくずれます。"],
["7","共有結合の結晶の融点は" + B + "。","非常に高い",0,"原子がぜんぶ強い共有結合でつながっているためです。"],
["7","共有結合の結晶は、" + B + "かたい。","非常に",0,"ダイヤモンドは、もっとも硬い物質として有名です。"],

["7","塩化ナトリウムの組成式は" + B + "。","NaCl",0,"ナトリウムイオンNa⁺と塩化物イオンCl⁻が1:1で結びついています。"],
["7","酸化銅(II)の組成式は" + B + "。","CuO",0,"イオン結晶の例です。"],
["7","ヨウ素の分子式は" + B + "。","I2",0,"分子結晶の例です。ヨウ素原子が2個つながった分子です。"],
["7","二酸化炭素の分子式は" + B + "。","CO2",0,"分子結晶の例です。固体はドライアイスです。"]
];
var CARDS = RAW.map(function (r, i) {
  return { id: r[0] + "-" + (i + 1), sec: r[0], q: r[1], a: r[2], pending: r[3] === 1 || r[3] === true, exp: r[4] || "" };
});
var LS_KEY = "kokyo-ichimon-kagaku-v1";
var state = { review: [], ok: {}, order: "random" };
function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && Array.isArray(s.review)) state = { review: s.review.slice(), ok: Object.assign({}, s.ok || {}), order: s.order === "order" ? "order" : "random" };
  } catch (e) {}
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

var view = "home", session = null;
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function secOf(id) { return SECTIONS.filter(function (s) { return s.id === id; })[0]; }
function cardsOfSec(id) { return CARDS.filter(function (c) { return c.sec === id; }); }
function reviewCards() { return CARDS.filter(function (c) { return state.review.indexOf(c.id) >= 0; }); }

function start(cards, mode, label) {
  if (!cards.length) return;
  session = { cards: state.order === "order" && mode !== "review" ? cards.slice() : shuffle(cards), i: 0, mode: mode, label: label, okN: 0, missN: 0, shown: false, lockUntil: 0 };
  view = "quiz";
  render();
}
function reveal() { session.shown = true; session.lockUntil = Date.now() + 450; render(); }
function answer(good) {
  if (Date.now() < session.lockUntil) return;
  var c = session.cards[session.i];
  if (good) {
    session.okN++;
    state.ok[c.id] = (state.ok[c.id] || 0) + 1;
    if (session.mode === "review") state.review = state.review.filter(function (x) { return x !== c.id; });
  } else {
    session.missN++;
    if (state.review.indexOf(c.id) < 0) state.review.push(c.id);
  }
  session.i++;
  session.shown = false;
  if (session.i >= session.cards.length) view = "result";
  render();
  window.scrollTo(0, 0);
  save();
}

function el(tag, props, kids) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    if (props[k] === null || props[k] === undefined) return;
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

function renderHome() {
  var rc = reviewCards();
  var optBtns = [["ランダム", "random"], ["順番どおり", "order"]].map(function (x) {
    return el("button", { type: "button", text: x[0], "aria-pressed": String(state.order === x[1]), onclick: function () { state.order = x[1]; save(); render(); } });
  });
  var secBtns = SECTIONS.map(function (s) {
    var all = cardsOfSec(s.id);
    var done = all.filter(function (c) { return state.ok[c.id] > 0 && state.review.indexOf(c.id) < 0; }).length;
    return el("button", { type: "button", class: "sec-btn", onclick: function () { start(all, "normal", s.name); } }, [
      el("div", null, [el("div", { class: "nm", text: s.id + ". " + s.name }), el("div", { class: "pg", text: "プリント " + s.page + " ・ " + all.length + "問" })]),
      el("div", { class: "st", text: "できた " + done + " / " + all.length }),
      el("div", { class: "bar" }, [el("i", { style: "width:" + Math.round(done / all.length * 100) + "%" })])
    ]);
  });
  var review = el("button", { type: "button", class: "review-card", onclick: function () { start(rc, "review", "復習フォルダ"); } }, [
    el("div", null, [el("div", { class: "big", text: "復習フォルダ" }), el("small", { text: rc.length ? "まちがえた問題だけ出題。「できた」で外れます" : "まちがえた問題がここにたまります" })]),
    el("div", { class: "count", text: String(rc.length) })
  ]);
  if (!rc.length) review.setAttribute("disabled", "");
  return el("div", { class: "home" }, [
    el("div", { class: "title-row" }, [el("h1", { text: "化学 一問一答" }), el("div", { class: "sub", text: "物質量・化学結合 ・ " + CARDS.length + "問" })]),
    review,
    el("div", { class: "opt" }, [el("span", { text: "出す順番" }), el("div", { class: "seg", role: "group", "aria-label": "出す順番" }, optBtns)]),
    el("div", { class: "sec-list" }, secBtns),
    el("button", { type: "button", class: "all-btn", text: "ぜんぶ出題(" + CARDS.length + "問)", onclick: function () { start(CARDS, "normal", "ぜんぶ"); } }),
    el("p", { class: "note", text: "問題を読んで、頭の中や紙に答えを書いてから「答えを見る」を押します。合っていたかは自分で選びます。進み具合は、このスマホの中に保存されます。" })
  ]);
}

function renderQuiz() {
  var c = session.cards[session.i];
  var tags = [];
  if (session.shown) tags.push(el("span", { class: "chip", text: secOf(c.sec).id + ". " + secOf(c.sec).name }));
  if (session.mode === "review") tags.push(el("span", { class: "chip warn", text: "復習" }));
  var kids = (tags.length ? [el("div", { class: "tag" }, tags)] : []).concat([el("p", { class: "q", text: c.q })]);
  if (session.shown) kids.push(el("div", { class: "a-box" }, [el("span", { class: "a-lbl", text: "答え" }), c.a]));
  if (session.shown && c.exp) kids.push(el("div", { class: "exp" }, [el("span", { class: "exp-lbl", text: "かいせつ" }), el("p", { text: c.exp })]));
  if (session.shown && c.pending) kids.push(el("p", { class: "pending-note", text: "この答えは、プリントが空欄だった部分を教科書の知識で埋めています。先生のノートと見比べてください。" }));
  var top = el("div", { class: "topbar" }, [
    el("div", { class: "row" }, [
      el("button", { type: "button", class: "back", text: "‹ もどる", onclick: function () { view = "home"; render(); } }),
      el("div", { class: "counter", text: (session.i + 1) + " / " + session.cards.length })
    ]),
    el("div", { class: "bar" }, [el("i", { style: "width:" + Math.round(session.i / session.cards.length * 100) + "%" })])
  ]);
  var actions = session.shown
    ? el("div", { class: "actions two" }, [
        el("button", { type: "button", class: "act miss", text: "まちがえた", onclick: function () { answer(false); } }),
        el("button", { type: "button", class: "act ok", text: "できた", onclick: function () { answer(true); } })
      ])
    : el("div", { class: "actions" }, [el("button", { type: "button", class: "act reveal", text: "答えを見る", onclick: reveal })]);
  return el("div", { class: "quiz" }, [top, el("div", { class: "card" }, kids), actions]);
}

function renderResult() {
  var rc = reviewCards();
  var btns = [];
  if (rc.length) btns.push(el("button", { type: "button", class: "btn2 primary", text: "復習フォルダを出題(" + rc.length + "問)", onclick: function () { start(rc, "review", "復習フォルダ"); } }));
  btns.push(el("button", { type: "button", class: "btn2" + (rc.length ? "" : " primary"), text: "もう一度", onclick: function () { start(session.cards, session.mode, session.label); } }));
  btns.push(el("button", { type: "button", class: "btn2", text: "ホームへ", onclick: function () { view = "home"; render(); } }));
  return el("div", { class: "result" }, [
    el("h2", { text: session.label + " おつかれさま" }),
    el("div", { class: "score" }, [
      el("div", { class: "ok" }, [el("b", { text: String(session.okN) }), "できた"]),
      el("div", { class: "miss" }, [el("b", { text: String(session.missN) }), "まちがえた"])
    ]),
    el("div", { class: "btns" }, btns)
  ]);
}

function render() {
  var app = document.getElementById("app");
  app.textContent = "";
  app.appendChild(view === "home" ? renderHome() : view === "quiz" ? renderQuiz() : renderResult());
}
loadState();
render();
</script></body></html>
