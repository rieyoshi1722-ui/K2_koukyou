<title>公民 一問一答 経済編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 1枚のカードに「問い」→タップで「答え」。ボタンはカードの真下に置いて、指が届く範囲に収める。 */
:root {
  --paper: #f3f5f9; --sheet: #ffffff; --grid: #e0e6f1; --ink: #1c2540; --ink-soft: #5a6684;
  --accent: #2b4da0; --accent-ink: #ffffff; --marker: #ffd4e4; --marker-ink: #7a1f4b;
  --ok: #1f8a5b; --ok-bg: #dff3e8; --miss: #c8452f; --miss-bg: #fde4de; --line: #cbd4e6;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;
    --accent: #8fb0ff; --accent-ink: #0f1626; --marker: #7a2d52; --marker-ink: #ffd9e8;
    --ok: #6fd3a2; --ok-bg: #173a2c; --miss: #ff9a86; --miss-bg: #432019; --line: #2f3d63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --sheet: #172036; --grid: #223052; --ink: #e8ecf6; --ink-soft: #9aa6c4;
  --accent: #8fb0ff; --accent-ink: #0f1626; --marker: #7a2d52; --marker-ink: #ffd9e8;
  --ok: #6fd3a2; --ok-bg: #173a2c; --miss: #ff9a86; --miss-bg: #432019; --line: #2f3d63; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.8; padding-inline: 16px; padding-block: 0; touch-action: manipulation; }
#app { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }

.home { display: flex; flex-direction: column; gap: 18px; padding-block: 22px 40px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.title-row h1 { font-size: 28px; font-weight: 900; }
.sub { color: var(--ink-soft); font-size: 13px; }
.review-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 14px; background: var(--miss-bg); border: 2px solid var(--miss); }
.review-card[disabled] { opacity: .55; cursor: default; }
.review-card .big { font-family: var(--font-display); font-weight: 900; font-size: 19px; }
.review-card .count { font-family: var(--font-display); font-weight: 900; font-size: 32px; font-variant-numeric: tabular-nums; color: var(--miss); }
.review-card small { display: block; color: var(--ink-soft); font-size: 12.5px; line-height: 1.5; }
.opt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
.seg { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
.seg button { padding: 4px 16px; font-weight: 700; font-size: 14px; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sec-list { display: grid; gap: 10px; }
.sec-btn { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 12px; background: var(--sheet); border: 1.5px solid var(--line); }
.sec-btn .nm { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.sec-btn .pg { font-size: 12px; color: var(--ink-soft); }
.sec-btn .st { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); text-align: right; }
.sec-btn .bar { grid-column: 1 / -1; }
.all-btn { padding: 15px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

.quiz { padding-block: 0 56px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); padding-block: 12px 8px; display: grid; gap: 8px; }
.topbar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.back { padding: 6px 10px; margin-left: -10px; font-weight: 700; color: var(--accent); }
.counter { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
.card { background-color: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px 16px 20px; margin-top: 8px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.tag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.chip.warn { background: var(--marker); color: var(--marker-ink); }
.q { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.7; margin: 0; overflow-wrap: anywhere; }
.a-box { margin-top: 16px; padding: 14px 14px; border-radius: 10px; background: var(--marker); color: var(--marker-ink); font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1.6; overflow-wrap: anywhere; }
.a-lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; opacity: .8; }
.pending-note { margin: 12px 0 0; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: var(--marker); color: var(--marker-ink); line-height: 1.5; }
.actions { display: grid; gap: 10px; margin-top: 16px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.act { min-height: 66px; padding: 15px 10px; border-radius: 14px; font-family: var(--font-display); font-weight: 900; font-size: 19px; }
.act.reveal { background: var(--accent); color: var(--accent-ink); }
.act.ok { background: var(--ok-bg); color: var(--ok); border: 2px solid var(--ok); }
.act.miss { background: var(--miss-bg); color: var(--miss); border: 2px solid var(--miss); }
.act:active { transform: translateY(1px); }

.result { display: flex; flex-direction: column; gap: 18px; padding-block: 40px; }
.result h2 { font-size: 26px; font-weight: 900; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score div { padding: 14px; border-radius: 12px; text-align: center; font-family: var(--font-display); font-weight: 700; }
.score .ok { background: var(--ok-bg); color: var(--ok); }
.score .miss { background: var(--miss-bg); color: var(--miss); }
.score b { display: block; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.btns { display: grid; gap: 10px; }
.btn2 { padding: 14px; border-radius: 12px; font-family: var(--font-display); font-weight: 700; font-size: 16px; border: 2px solid var(--accent); color: var(--accent); }
.btn2.primary { background: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
