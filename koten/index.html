{t:"読み方(現代仮名遣いで答える)",b:"判官＝ほうがん\n大将軍＝たいしょうぐん\n教経＝のりつね　知盛＝とももり\n新中納言＝しんちゅうなごん\n郎等＝ろうどう\n生年＝しょうねん\n大音声＝だいおんじょう\n竜田川＝たつたがわ\n汀＝みぎわ\n薄紅＝うすくれない\n鎧＝よろい　甲＝かぶと　錣＝しころ\n大童＝おおわらわ　大手＝おおで\n越中次郎兵衛＝えっちゅうのじろうびょうえ\n上総五郎兵衛＝かずさのごろうびょうえ\n悪七兵衛＝あくしちびょうえ\n飛騨四郎兵衛＝ひだのしろうびょうえ\n安芸太郎＝あきのたろう"},

function mk(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d}
function vbox(text,cls){var d=mk("div","vbox "+(cls||""));text.split("\n").forEach(function(l){d.appendChild(mk("p","",l))});return d}
function renderNotes(id,arr){var host=document.getElementById(id);arr.forEach(function(n){host.appendChild(mk("h3","",n.t));host.appendChild(vbox(n.b,"note"))})}
function renderQs(id,arr){
  var host=document.getElementById(id);
  arr.forEach(function(it,i){
    var c=mk("article","qc");
    c.appendChild(mk("div","qn","問"+(i+1)+"<span>"+it.k+"</span>"));
    c.appendChild(vbox(it.q,"q"));
    var b=mk("button","rev","答えと解説を見る");b.type="button";b.setAttribute("aria-expanded","false");
    var ans=vbox('<b>答え</b>\n'.replace("\n","")+"\n"+it.a.replace(/\n/g,"\n")+"\n"+it.e,"ans");
    var ps=ans.querySelectorAll("p");ps[0].className="t";
    ans.hidden=true;
    b.addEventListener("click",function(){var open=ans.hidden;ans.hidden=!open;b.setAttribute("aria-expanded",open?"true":"false");b.textContent=open?"答えをとじる":"答えと解説を見る"});
    c.appendChild(b);c.appendChild(ans);host.appendChild(c);
  });
}
renderNotes("gramNotes",GRAM_NOTES);renderQs("gramQs",GRAM_Q);
renderNotes("heikeNotes",HEIKE_NOTES);renderQs("heikeQs",HEIKE_Q);
function setAll(open){document.querySelectorAll(".qc").forEach(function(c){var a=c.querySelector(".ans"),b=c.querySelector(".rev");a.hidden=!open;b.setAttribute("aria-expanded",open?"true":"false");b.textContent=open?"答えをとじる":"答えと解説を見る"})}
document.getElementById("openAll").addEventListener("click",function(){setAll(true)});
document.getElementById("closeAll").addEventListener("click",function(){setAll(false)});
</script>
